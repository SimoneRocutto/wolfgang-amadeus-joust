<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>JOUST DASHBOARD</title>
    <link rel="stylesheet" href="/css/dashboard.css" />
  </head>
  <body class="dashboard-body">
    <h1>WOLFGANG AMADEUS JOUST</h1>

    <div id="game-info">
      <h2 id="header">Lobby</h2>

      <div class="players-section">
        <div id="active-players-section" class="hidden">
          <h3>🎮 Active Players</h3>
          <div id="active-players"></div>
        </div>
        <div id="lobby-players-section">
          <h3 id="lobby-players-title" class="hidden">⏳ Lobby</h3>
          <div id="lobby-players"></div>
        </div>
      </div>
    </div>

    <button id="start-game-btn">Start game</button>
    <button id="to-lobby-btn" class="hidden">Back to lobby</button>

    <div class="flex flex-center mt-8">
      <div id="qrcode"></div>
    </div>

    <!-- Scripts -->
    <script src="/socket.io/socket.io.js"></script>
    <script src="/assets/scripts/qrcode.min.js"></script>
    <script src="/js/shared/socketService.js"></script>
    <script src="/js/shared/audioService.js"></script>
    <script src="/js/dashboard/music_list.js" type="text/javascript"></script>
    <script src="/js/dashboard/ui.js"></script>
    <script src="/js/dashboard/app.js"></script>
  </body>
</html>
