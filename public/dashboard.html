<!DOCTYPE html>
<html>
  <head>
    <title>JOUST DASHBOARD</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body class="dashboard-body">
    <h1>WOLFGANG AMADEUS JOUST</h1>
    <div id="game-info">
      <h2 id="header"></h2>
      <div id="active-players"></div>
      <div id="lobby-players"></div>
    </div>

    <audio id="bg-music" loop>
      <source src="assets/sounds/bach.mp3" type="audio/mpeg" />
    </audio>

    <button id="start-game-btn">Start game</button>
    <button id="to-lobby-btn" class="hidden">Back to lobby</button>

    <div class="flex flex-center mt-8">
      <div id="qrcode"></div>
    </div>

    <script src="/socket.io/socket.io.js"></script>
    <script src="/assets/scripts/qrcode.min.js" type="text/javascript"></script>
    <script src="dashboard.js"></script>
  </body>
</html>
