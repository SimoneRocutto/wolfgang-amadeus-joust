<!DOCTYPE html>
<html lang="it">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Wolfgang Amadeus Joust</title>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      body {
        font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
        background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        min-height: 100vh;
        display: flex;
        justify-content: center;
        align-items: center;
        padding: 20px;
        transition: background 0.5s ease;
      }

      /* Game State Body Backgrounds */
      body.alive {
        background: linear-gradient(135deg, #10b981 0%, #34d399 100%);
      }

      body.dead {
        background: linear-gradient(135deg, #eb3349 0%, #f45c43 100%);
      }

      body.lobby {
        background: linear-gradient(135deg, #f093fb 0%, #f5576c 100%);
      }

      .hidden {
        display: none !important;
      }

      /* ===== PLAYER UI STYLES ===== */

      /* Login Screen */
      #login-screen {
        background: white;
        border-radius: 24px;
        padding: 48px 32px;
        box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
        text-align: center;
        max-width: 400px;
        width: 100%;
        animation: slideIn 0.5s ease-out;
      }

      @keyframes slideIn {
        from {
          opacity: 0;
          transform: translateY(30px);
        }
        to {
          opacity: 1;
          transform: translateY(0);
        }
      }

      #login-screen h1 {
        font-size: 2.5rem;
        background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
        background-clip: text;
        margin-bottom: 32px;
        font-weight: 800;
        letter-spacing: -1px;
      }

      #username {
        width: 100%;
        padding: 16px 20px;
        font-size: 1.1rem;
        border: 3px solid #e0e0e0;
        border-radius: 12px;
        margin-bottom: 20px;
        transition: all 0.3s ease;
        font-weight: 500;
      }

      #username:focus {
        outline: none;
        border-color: #667eea;
        box-shadow: 0 0 0 4px rgba(102, 126, 234, 0.1);
      }

      #join-btn {
        width: 100%;
        padding: 18px;
        font-size: 1.1rem;
        font-weight: 700;
        background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        color: white;
        border: none;
        border-radius: 12px;
        cursor: pointer;
        transition: all 0.3s ease;
        text-transform: uppercase;
        letter-spacing: 1px;
      }

      #join-btn:hover {
        transform: translateY(-2px);
        box-shadow: 0 10px 25px rgba(102, 126, 234, 0.4);
      }

      #join-btn:active {
        transform: translateY(0);
      }

      /* Lobby Screen */
      .white-box {
        background: white;
        border-radius: 24px;
        padding: 48px 32px;
        box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
        text-align: center;
        max-width: 400px;
        width: 100%;
        animation: slideIn 0.5s ease-out;
      }

      .white-box h1 {
        font-size: 2rem;
        color: #333;
        margin-bottom: 24px;
        font-weight: 700;
      }

      .white-box h3 {
        font-weight: 400;
      }

      #lobby-screen::after {
        content: "🎮";
        font-size: 4rem;
        display: block;
        margin-top: 24px;
        animation: bounce 2s infinite;
      }

      @keyframes bounce {
        0%,
        100% {
          transform: translateY(0);
        }
        50% {
          transform: translateY(-20px);
        }
      }

      /* Game Screen */
      #game-screen {
        text-align: center;
        width: 100%;
        max-width: 500px;
        animation: slideIn 0.5s ease-out;
      }

      #status-indicator {
        font-size: 4rem;
        font-weight: 900;
        padding: 60px 40px;
        border-radius: 24px;
        margin-bottom: 24px;
        text-transform: uppercase;
        letter-spacing: 3px;
        box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
        transition: all 0.3s ease;
        background: white;
        color: #10b981;
        border: 6px solid rgba(255, 255, 255, 0.5);
      }

      body.alive #status-indicator {
        animation: pulse 2s ease-in-out infinite;
        background: white;
        color: #10b981;
        text-shadow: 2px 2px 8px rgba(16, 185, 129, 0.3);
      }

      body.dead #status-indicator {
        background: white;
        color: #eb3349;
        text-shadow: 2px 2px 8px rgba(235, 51, 73, 0.3);
        animation: shake 0.5s;
      }

      @keyframes pulse {
        0%,
        100% {
          transform: scale(1);
        }
        50% {
          transform: scale(1.05);
        }
      }

      @keyframes shake {
        0%,
        100% {
          transform: translateX(0);
        }
        25% {
          transform: translateX(-10px);
        }
        75% {
          transform: translateX(10px);
        }
      }

      #debug-info {
        background: rgba(255, 255, 255, 0.95);
        padding: 16px 24px;
        border-radius: 16px;
        font-size: 1.5rem;
        font-weight: 600;
        color: #333;
        box-shadow: 0 8px 24px rgba(0, 0, 0, 0.15);
        font-family: "Courier New", monospace;
      }

      /* Responsive */
      @media (max-width: 480px) {
        #login-screen h1 {
          font-size: 2rem;
        }

        #status-indicator {
          font-size: 3rem;
          padding: 40px 20px;
        }
      }
    </style>
  </head>
  <body>
    <!-- PLAYER UI SCREENS -->
    <div id="login-screen">
      <h1>Pick your name</h1>
      <input
        type="text"
        id="username"
        placeholder="Enter Your Name"
        maxlength="10"
      />
      <button id="join-btn">Join Game</button>
    </div>

    <div id="acceleration-missing" class="white-box hidden">
      <h1>Brave user?</h1>
      <h3>
        In order to play, enable motion sensors by going to
        <strong>Settings -> Site settings -> Motion sensors</strong>
      </h3>
    </div>

    <div id="lobby-screen" class="white-box hidden">
      <h1>In Lobby</h1>
    </div>

    <div id="game-screen" class="hidden">
      <div id="status-indicator">ALIVE</div>
      <div id="debug-info">G: 0.0</div>
    </div>

    <script src="/socket.io/socket.io.js"></script>
    <script src="client.js"></script>
  </body>
</html>
