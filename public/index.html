<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
    />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <title>Wolfgang Amadeus Joust</title>
    <link rel="stylesheet" href="/css/player.css" />
  </head>
  <body>
    <!-- Login Screen -->
    <div id="login-screen">
      <h1>Pick your name</h1>
      <input
        type="text"
        id="username"
        placeholder="Enter Your Name"
        maxlength="10"
      />
      <button id="join-btn">Join Game</button>
    </div>

    <!-- Accelerometer Missing Screen -->
    <div id="acceleration-missing" class="white-box hidden">
      <h1>Brave user?</h1>
      <h3>
        In order to play, enable motion sensors by going to
        <strong>Settings → Site settings → Motion sensors</strong>
      </h3>
    </div>

    <!-- Lobby Screen -->
    <div id="lobby-screen" class="white-box hidden">
      <h1>In Lobby</h1>
    </div>

    <!-- Game Screen -->
    <div id="game-screen" class="hidden">
      <div id="status-indicator">ALIVE</div>
      <div id="debug-info">Force: 0.0</div>
    </div>

    <!-- Scripts -->
    <script src="/socket.io/socket.io.js"></script>
    <script src="/js/shared/socketService.js"></script>
    <script src="/js/shared/audioService.js"></script>
    <script src="/js/player/motionService.js"></script>
    <script src="/js/player/ui.js"></script>
    <script src="/js/player/app.js"></script>
  </body>
</html>
